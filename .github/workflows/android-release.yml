name: Android Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve SemVer release metadata
        id: version
        run: ./scripts/resolve-release-version.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=0
          for var_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!var_name:-}" ]]; then
              printf 'Erro: secret obrigatório "%s" não está configurado. Consulte docs/RELEASE.md.\n' "$var_name" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Robolectric Maven artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-m2-robolectric-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and Android Lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.VERSION_NAME }}" \
            -PversionCode="${{ steps.version.outputs.VERSION_CODE }}" \
            --stacktrace

      - name: Verify APK signature and package assets
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            printf 'Erro: APK release assinado não encontrado em %s\n' "$APK_PATH" >&2
            exit 1
          fi

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            printf 'Erro: apksigner não encontrado em %s/build-tools\n' "$ANDROID_HOME" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_PATH"

          mkdir -p release-assets
          APK_NAME="gym-slut-${GITHUB_REF_NAME}.apk"
          cp "$APK_PATH" "release-assets/${APK_NAME}"
          (cd release-assets && sha256sum "$APK_NAME" > "${APK_NAME}.sha256")
          ls -lh release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--title "Gym Slut ${GITHUB_REF_NAME}" --generate-notes)
          if [[ "${{ steps.version.outputs.IS_PRERELEASE }}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* "${flags[@]}"

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.jks"
